[printer]
kinematics: corexy
max_velocity: 500
#max_accel: 7000
max_accel: 20000
#max_accel_to_decel: 7000
max_z_velocity: 100
max_z_accel: 50
square_corner_velocity: 10

[input_shaper]
#shaper_freq_x: 54
#shaper_freq_y: 38
shaper_type: mzv

[skew_correction]

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-id/usb-Klipper_sam4e8e_00313753383436313139303531303038-if00
restart_method: command

[sx1509 duex]
i2c_address: 62 # Address is fixed on duex boards

[include ./printer_configs/z_axis_configs.cfg]
[include ./printer_configs/xy_axis_configs.cfg]



#On drive E0
[extruder]
step_pin: PD4
dir_pin: PD9
enable_pin: !PC6
#step_distance: .0013
full_steps_per_rotation: 400
#gear_ratio: 50:17
rotation_distance: 8.32
microsteps: 64
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.14
heater_pin: !PA20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC15
#control: pid
#pid_Kp: 18.508654
#pid_Ki: 1.019761
#pid_Kd: 83.983019
min_temp: 0
max_temp: 300
max_extrude_cross_section: 4

[tmc2660 extruder]
cs_pin: PC25
spi_bus: usart1
interpolate: false
run_current: 1.100
sense_resistor: 0.051

[heater_bed]
heater_pin: !PA19
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC13
control: pid
pid_Kp: 46.618
pid_Ki: 0.482
pid_Kd: 1127.569
min_temp: 0
max_temp: 130

#[probe]
#pin: !PD29
#z_offset: 0.085
#samples: 3
#samples_result: median
#samples_tolerance: 0.100
#samples_tolerance_retries: 3
#activate_gcode:
#       G4 P800

[bltouch]
sensor_pin: ^PC1
control_pin: !PC3
#z_offset: 1.7
# higher value = closer to bed
#z_offset: 1.1
x_offset: 2.5
y_offset: 30
samples: 3
samples_result: median
samples_tolerance: 0.100
samples_tolerance_retries: 3
stow_on_each_sample: false

[safe_z_home]
home_xy_position: 150,150 # Change coordinates to the center of your print bed
speed: 80
z_hop: 10                 # Move up 10mm
z_hop_speed: 15



# Fan0
[fan]
pin: PC23

# Fan1 controlled by extruder
[heater_fan nozzle_cooling_fan]
pin: PC26
heater: extruder
heater_temp: 45
fan_speed: 1.0





[static_digital_output onboard_led]
pins: !PC2

#[output_pin GPIO1] # General purpose pin broken out on the duex
#pin: sx1509_duex:PIN_11
#pwm: False
#value: 1

#[hall_filament_width_sensor]

#adc1: PC30
#adc2: PC31
#Cal_dia1: 1.48 # Reference diameter point 1 (mm)
#Cal_dia2: 2.00 # Reference diameter point 2 (mm)
#Raw_dia1: 16626
#Raw_dia2: 16992

#default_nominal_filament_diameter: 1.75
#max_difference: 0.20
#measurement_delay: 820


[output_pin light]
pin: sx1509_duex:PIN_4
pwm: False
value: 0

[output_pin extruderfan]
pin: PA0
pwm: False
value: 1

[gcode_macro M355]
gcode:
        SET_PIN PIN=light VALUE={params.S}

[include mainsail.cfg]

