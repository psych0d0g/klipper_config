[printer]
kinematics: corexy
max_velocity: 250  # before: 300
max_accel: 5000   # before: 3000             #Max 4000
max_z_velocity: 50 # before: 20          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 1500
square_corner_velocity: 10

[input_shaper]
shaper_freq_x: 83.6 # center frequency for the X axis filter
shaper_type_x: 2hump_ei # filter type for the X axis
shaper_freq_y: 42.8 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.090 # damping ratio for the X axis
damping_ratio_y: 0.046 # damping ratio for the Y axis

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial0
restart_method: command

[include ./printer_configs/birdsnest.cfg]
[include ./printer_configs/tool_0.cfg]
[include ./gcode_macros/nozzle_scrub.cfg]

[temperature_sensor MCU_Kraken]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Raspberry_PI]
sensor_type: temperature_host

[include ./printer_configs/z_axis_configs.cfg]
[include ./printer_configs/xy_axis_configs.cfg]
[include ./printer_configs/quad_gantry_leveling.cfg]

[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB
sensor_type: ATC Semitec 104GT-2
#control: pid (check autogenerated section)
min_temp: 0
max_temp: 130

[heater_fan heater_bed]
pin: PA1
heater: heater_bed

[temperature_sensor bed_heater_mat]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB0

[bed_mesh]
speed: 300
horizontal_move_z: 8
mesh_min: 20, 20
mesh_max: 330,330
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 7,7 # Values should be odd, so one point is directly at bed center
algorithm: bicubic
zero_reference_position: 175, 175
## relative_reference_index: 12 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)
##  BED_MESH_PROFILE SAVE=default

[include ./printer_configs/chamber.cfg]

[gcode_macro M141]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}

[gcode_macro M191]
gcode:
   SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S}
   TEMPERATURE_WAIT SENSOR="heater_generic heater_chamber" MINIMUM={params.S}

[include ./gcode_macros/homing.cfg]
[include ./gcode_macros/print_start.cfg]

[controller_fan Electronics_Fans]
pin: PA0
fan_speed: 0.2
heater: heater_bed # TODO: change when we have an extruder

#[fan_generic fan6]
#pin: PA6
#tachometer_pin: PC1

#[fan_generic fan7]
#pin: PE8
#tachometer_pin: PG0

[led Chamber_LED]
white_pin: PA5
hardware_pwm: true
initial_WHITE: 0.02

[safe_z_home]
home_xy_position: 175, 175
#   A X, Y coordinate (e.g. 100, 100) where the Z homing should be
#   performed. This parameter must be provided.
#speed: 50.0
#   Speed at which the toolhead is moved to the safe Z home
#   coordinate. The default is 50 mm/s
z_hop: 10
#   Distance (in mm) to lift the Z axis prior to homing. This is
#   applied to any homing command, even if it doesn't home the Z axis.
#   If the Z axis is already homed and the current Z position is less
#   than z_hop, then this will lift the head to a height of z_hop. If
#   the Z axis is not already homed the head is lifted by z_hop.
#   The default is to not implement Z hop.
z_hop_speed: 10.0
#   Speed (in mm/s) at which the Z axis is lifted prior to homing. The
#   default is 15 mm/s.
#move_to_previous: False
#   When set to True, the X and Y axes are reset to their previous
#   positions after Z axis homing. The default is False.


[board_pins]
aliases:
    # FPC header, Aliases EXP1 & EXP2 for mini12864
    EXP1_1=PG5, EXP1_2=PG4,
    EXP1_3=PG3, EXP1_4=PG2,
    EXP1_5=PD15, EXP1_6=PD14,
    EXP1_7=PD13, EXP1_8=PD12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PG8, EXP2_4=PE11,
    EXP2_5=PG7, EXP2_6=PE14,
    EXP2_7=PG6, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>
[include ./printer_configs/shaketune.cfg]
[include ./mainsail.cfg]

