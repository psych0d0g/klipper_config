[printer]
kinematics: corexy
max_velocity: 500
#max_accel: 7000
max_accel: 20000
#max_accel_to_decel: 7000
max_z_velocity: 100
max_z_accel: 50
square_corner_velocity: 10

[input_shaper]
shaper_freq_x: 46.4 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 68.2 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.047 # damping ratio for the X axis
damping_ratio_y: 0.044 # damping ratio for the Y axis


[skew_correction]

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial0
restart_method: command

[temperature_sensor MCU_Kraken]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Raspberry_PI]
sensor_type: temperature_host

[include ./printer_configs/z_axis_configs.cfg]
[include ./printer_configs/xy_axis_configs.cfg]
[include ./printer_configs/z_tilt.cfg]
[include ./printer_configs/bed_mesh.cfg]
[include ./printer_configs/tool_0.cfg]
[include ./printer_configs/orbitersensor.cfg]

[heater_bed]
heater_pin: PF5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0
control: pid
pid_Kp: 46.618
pid_Ki: 0.482
pid_Kd: 1127.569
min_temp: 0
max_temp: 130

[safe_z_home]
home_xy_position: 150,150 # Change coordinates to the center of your print bed
speed: 80
z_hop: 10                 # Move up 10mm
z_hop_speed: 15

#[hall_filament_width_sensor]

#adc1: PC30
#adc2: PC31
#Cal_dia1: 1.48 # Reference diameter point 1 (mm)
#Cal_dia2: 2.00 # Reference diameter point 2 (mm)
#Raw_dia1: 16626
#Raw_dia2: 16992

#default_nominal_filament_diameter: 1.75
#max_difference: 0.20
#measurement_delay: 820

[output_pin light]
pin: PA0
pwm: False
value: 0.1

[gcode_macro M355]
gcode:
        SET_PIN PIN=light VALUE={params.S}

[include ./printer_configs/shaketune.cfg]
[include mainsail.cfg]

