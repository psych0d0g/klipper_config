# S1
[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
microsteps: 64
rotation_distance: 40
position_endstop: -5
position_min: -5
position_max: 350
homing_speed: 120
homing_retract_dist: 5
use_sensorless_homing: true
endstop_pin: tmc5160_stepper_x:virtual_endstop

# S2
[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
microsteps: 64
rotation_distance: 40
position_endstop: -10
position_min: -10
position_max: 350
homing_speed: 120
homing_retract_dist: 10
use_sensorless_homing: true
endstop_pin: tmc5160_stepper_y:virtual_endstop

[tmc5160 stepper_x]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PC15
run_current: 2.500
sense_resistor: 0.022
driver_SGT: 0
interpolate: false

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PF0
run_current: 2.500
sense_resistor: 0.022
driver_SGT: 0
interpolate: false

