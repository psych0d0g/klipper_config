[stepper_x]
step_pin: PD6
dir_pin: !PD11
enable_pin: !PC6
#step_distance: .005
full_steps_per_rotation: 400
rotation_distance: 32
microsteps: 64
endstop_pin: ^PC14
position_endstop: 300
position_max: 300
homing_speed: 120

[tmc2660 stepper_x]
cs_pin: PD14 # X_SPI_EN Required for communication
spi_bus: usart1 # All TMC2660 drivers are connected to USART1
interpolate: False # 1/16 micro-steps interpolated to 1/256
run_current: 1.200
sense_resistor: 0.051
idle_current_percent: 20

[stepper_y]
step_pin: PD7
dir_pin: PD12
enable_pin: !PC6
#step_distance: .005
full_steps_per_rotation: 400
rotation_distance: 32
microsteps: 64
endstop_pin: ^PA2
position_endstop: 0
position_max: 300
homing_speed: 120

[tmc2660 stepper_y]
cs_pin: PC9
spi_bus: usart1
interpolate: False
run_current: 1.200
sense_resistor: 0.051
idle_current_percent: 20