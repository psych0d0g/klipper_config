[stepper_x]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
#step_distance: .005
full_steps_per_rotation: 400
rotation_distance: 32
microsteps: 64
endstop_pin: PC15
position_endstop: 300
position_max: 300
homing_speed: 120

[tmc5160 stepper_x]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PC15
run_current: 1.500
sense_resistor: 0.05
driver_SGT: 0
interpolate: true

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
#step_distance: .005
full_steps_per_rotation: 400
rotation_distance: 32
microsteps: 64
endstop_pin: ^tool0:PB6
position_endstop: 0
position_max: 300
homing_speed: 120

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PF0
run_current: 1.500
sense_resistor: 0.05
driver_SGT: 0
interpolate: true