[mcu tool0]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_0D0026000950415742363820-if00

[extruder]
step_pin: tool0:PB9 
dir_pin: tool0:PB8
enable_pin: !tool0:PB7

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
rotation_distance: 4.45   #22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
##  Use 7.5:1 for Galileo
##  gear_ratio: 50:10               #for Stealthburner/Clockwork2 BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: tool0: PA7 
pullup_resistor: 2200
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: PT1000
sensor_pin: tool0:PA6 
min_temp: -273.15 #1 #-273.15 
max_temp: 360 #360 
max_power: 1.0
min_extrude_temp: -273
control = pid
pid_kp = 34.250
pid_ki = 11.417
pid_kd = 25.687
##  Try to keep pressure_advance below 1.0
#pressure_advance: 0.02 #0.05
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5000.0

[tmc2209 extruder]
uart_pin: tool0:PC14
interpolate: true
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
#diag_pin: tool0:PC15

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg

## TAP
[probe]
pin: ^tool0:PA10
x_offset: 0
y_offset: 0
z_offset: -0.9
speed: 10.0
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3


#####################################################################
# Input Shaper
#####################################################################

[adxl345]
cs_pin: tool0:PB12
spi_software_sclk_pin: tool0:PB10
spi_software_mosi_pin: tool0:PB11
spi_software_miso_pin: tool0:PB2
#axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    175,175,30 # an example

[heater_fan Tool_0_Hotend]
pin: tool0:PA9
max_power:1.0
shutdown_speed:0.0
cycle_time:0.01
hardware_pwm:false
kick_start_time:0.10
tachometer_pin: tool0:PC6
# Please make sure the feedback level does not exceed 5V!
#tachometer_ppr:
#tachometer_poll_interval:
heater: extruder
heater_temp: 50.0
#fan_speed: 1.0
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when its associated heater is enabled. The default
#   is 1.0

[multi_pin part_cooling_fans]
pins: tool0:PB15, tool0:PA5

[fan]
pin: multi_pin:part_cooling_fans
max_power:1.0
shutdown_speed:0.0
cycle_time:0.01
hardware_pwm:false
kick_start_time:0.10
#tachometer_pin: tool0:PB14
# Please make sure the feedback level does not exceed 5V!
#tachometer_ppr:
#tachometer_poll_interval:


#####################################################################
#	Mcu & Driver Temperature
#####################################################################

[temperature_sensor tool_0_MCU]
sensor_type: temperature_mcu
sensor_mcu: tool0
min_temp: 0
max_temp: 150

[temperature_sensor Tool_0_TMC]
sensor_type: Generic 3950
sensor_pin: tool0: PA3
min_temp:0
max_temp:150

#####################################################################
#	Voltage Monitor
#####################################################################

[adc_temperature Tool_0_5V_Monitor]
temperature1: 5
voltage1: 3.0
temperature2: 4
voltage2: 2.4
temperature3: 3
voltage3: 1.8

[adc_temperature Tool_0_24V_Monitor]
temperature1: 24
voltage1: 3.13
temperature2: 22
voltage2: 2.87
temperature3: 21
voltage3: 2.74

[temperature_sensor Tool_0_5V_Monitor]
sensor_type: Tool_0_5V_Monitor
sensor_pin: tool0:PA0   #5V_MON
adc_voltage: 3.3
voltage_offset: 0

[temperature_sensor Tool_0_24V_Monitor]
sensor_type: Tool_0_24V_Monitor
sensor_pin: tool0:PA4   #24V_MON
adc_voltage: 3.3
voltage_offset: 0

[neopixel tool0_LED]
pin: tool0: PB1 #IO4
chain_count: 3
color_order: GRB, GRBW, GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.5
